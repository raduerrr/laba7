<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЛР7</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">

                        </svg>
                    </button>

                    <div class="slider-window">
                        <div id="slider-track" class="slider-track">
                            <div class="slide-item">
                                <figure class="slide-card">
                                    <img src="image1.jpg" alt="Изображение 1" width="600" height="400" class="slide-image">
                                    <figcaption class="slide-caption">Фото 1</figcaption>
                                </figure>
                            </div>
                            <div class="slide-item">
                                <figure class="slide-card">
                                    <img src="image2.jpg" alt="Изображение 2" width="600" height="400" class="slide-image">

                                </figure>
                            </div>
                            <div class="slide-item">
                                <figure class="slide-card">
                                    <img src="image3.jpeg" alt="Изображение 3" width="600" height="400" class="slide-image">
                                    <figcaption class="slide-caption">Фото 3</figcaption>
                                </figure>
                            </div>
                            <div class="slide-item">
                                <figure class="slide-card">
                                    <img src="image4.jpg" alt="Изображение 4" width="600" height="400" class="slide-image">
                                    <figcaption class="slide-caption">Фото 4</figcaption>
                                </figure>
                            </div>
                            <div class="slide-item">
                                <figure class="slide-card">
                                    <img src="image5.jpg" alt="Изображение 5" width="600" height="400" class="slide-image">
                                    <figcaption class="slide-caption">Фото 5</figcaption>
                                </figure>
                            </div>
                            <div class="slide-item">
                                <figure class="slide-card">
                                    <img src="image6.png" alt="Изображение 6" width="600" height="400" class="slide-image">
                                    <figcaption class="slide-caption">Фото 6</figcaption>
                                </figure>
                            </div>
                            <div class="slide-item">
                                <figure class="slide-card">
                                    <img src="image7.jpg"Изображение 7" width="600" height="400" class="slide-image">
                                    <figcaption class="slide-caption">Фото 7</figcaption>
                                </figure>
                            </div>
                            <div class="slide-item">
                                <figure class="slide-card">
                                    <img src="image8.jpg" alt="Изображение 8" width="600" height="400" class="slide-image">
                                    <figcaption class="slide-caption">Фото 8</figcaption>
                                </figure>
                            </div>
                        </div>
                    </div>

                    <button type="button" class="slider-arrow slider-arrow-next" aria-label="Следующее изображение">
                        <svg viewBox="0 0 24 24" class="arrow-icon" width="24" height="24" aria-hidden="true">
                            <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"></path>
                        </svg>
                    </button>
                </div>

                <div class="pager-container">
                    <div class="pager-info">
                        Страница <span id="current-page" class="pager-current">1</span> из <span id="total-pages" class="pager-total">3</span>
                    </div>
                    <div id="pager-dots" class="pager-dots"></div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>2026</p>
        </div>
    </footer>

    <script src="jquery-3.4.1.min.js"></script>
